<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERMINAL_DASHBOARD | SYSTEM_ACCESS</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <meta name="description" content="High-performance brutalist dashboard for system shortcuts and link management.">
</head>
<body>
    <canvas id="matrix-bg"></canvas>
    <div class="scanlines"></div>

    <!-- Huashu-Design Watermark -->
    <div style="position: fixed; bottom: 24px; right: 32px; font-size: 10px; color: rgba(255,255,255,0.3); letter-spacing: 0.2em; font-family: 'JetBrains Mono', monospace; pointer-events: none; z-index: 1001; text-transform: uppercase;">
        Design by Huashu-Design
    </div>

    <div class="container">
        <header>
            <div class="glitch-wrapper">
                <h1 class="glitch" data-text="SYSTEM_HUB">SYSTEM_HUB</h1>
            </div>
            <div class="system-info">
                <div id="terminal-date">--- LOADING_TIMESTAMP ---</div>
                <div id="terminal-status">CONNECTED // SECURE_ENCRYPTION_ACTIVE</div>
            </div>
        </header>

        <main>
            <div class="action-bar">
                <button id="open-terminal" class="btn-hacker">
                    [+] INITIALIZE_NEW_DEPLOYMENT
                </button>
            </div>

            <div id="dashboard-grid" class="dashboard-grid">
                <!-- Shortcuts will be injected here -->
            </div>
        </main>

        <!-- Terminal Modal for Adding Links -->
        <div id="terminal-modal" class="modal">
            <div class="modal-content hacker-panel">
                <div class="panel-header">
                    <span class="panel-title">INTERFACE::NODE_CREATION</span>
                    <button id="close-terminal" class="close-btn" aria-label="Close Interface">&times;</button>
                </div>
                <div class="panel-body">
                    <div class="input-group">
                        <label for="link-name">IDENTIFIER:</label>
                        <input type="text" id="link-name" placeholder="E.G. CORE_SERVER_ALPHA" autocomplete="off">
                    </div>
                    <div class="input-group">
                        <label for="link-url">TARGET_ADDR:</label>
                        <input type="text" id="link-url" placeholder="HTTPS://..." autocomplete="off">
                    </div>
                    <button id="save-link" class="btn-hacker full-width">
                        EXECUTE_DEPLOYMENT_SEQUENCE
                    </button>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <div class="footer-text">
            <span>[MRLAZY_OS_CORE_V1.0.4]</span>
            <span>ENCRYPTED_HANDSHAKE: OK</span>
            <span>UPTIME: 99.998%</span>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
