<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hacker Dashboard | System Access</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <canvas id="matrix-bg"></canvas>
    <div class="scanlines"></div>

    <div class="container">
        <header>
            <div class="glitch-wrapper">
                <h1 class="glitch" data-text="SYSTEM_DASHBOARD">SYSTEM_DASHBOARD</h1>
            </div>
            <div class="system-info">
                <span id="terminal-date"></span>
                <span id="terminal-status">STATUS: SECURE</span>
            </div>
        </header>

        <main>
            <div class="action-bar">
                <button id="open-terminal" class="btn-hacker">
                    <span class="btn-text">> INITIALIZE_NEW_LINK</span>
                    <span class="btn-glitch"></span>
                </button>
            </div>

            <div id="dashboard-grid" class="dashboard-grid">
                <!-- Shortcuts will be injected here -->
            </div>
        </main>

        <!-- Terminal Modal for Adding Links -->
        <div id="terminal-modal" class="modal">
            <div class="modal-content hacker-panel">
                <div class="panel-header">
                    <span class="panel-title">SYSTEM_INPUT_INTERFACE</span>
                    <button id="close-terminal" class="close-btn">&times;</button>
                </div>
                <div class="panel-body">
                    <div class="input-group">
                        <label for="link-name">NAME_ID:</label>
                        <input type="text" id="link-name" placeholder="e.g. DATABASE_ALPHA" autocomplete="off">
                    </div>
                    <div class="input-group">
                        <label for="link-url">TARGET_URL:</label>
                        <input type="text" id="link-url" placeholder="https://..." autocomplete="off">
                    </div>
                    <button id="save-link" class="btn-hacker full-width">
                        <span class="btn-text">EXECUTE_DEPLOYMENT</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <div class="footer-text">
            [MrLazy_OS v1.0.4] | ENCRYPTED_CONNECTION: ACTIVE
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
